name: 部署站点

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # job 级环境变量：CONTENT_ROOT 必须覆盖到 npm 子进程，
    # 否则 prebuild 钩子会因找不到内容仓而失败。
    env:
      CONTENT_ROOT: ${{ github.workspace }}/content
    steps:
      - name: 检出站点仓
        uses: actions/checkout@v5

      - name: 检出内容仓
        uses: actions/checkout@v5
        with:
          repository: diuci/k12-chinese-poetry
          path: content

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成脚本自检
        # 先证明生成脚本里的护栏抓得住坏样本，再看它说「通过」值不值得信。
        # 这道自检先前存在但没接进链——存在但没接进链的检查等同于没有检查。
        run: python tools/build-site.py --selftest

      - name: 从内容仓生成站点页面
        run: python tools/build-site.py

      - name: 法律护栏自检
        # 先证明检查器抓得住坏样本，再看它说"通过"值不值得信。
        run: node tools/check-legal.mjs --selftest

      - name: 法律护栏
        run: node tools/check-legal.mjs

      - name: 四站 UI 闸门自检
        run: node tools/check-ui.mjs --selftest

      - name: 四站 UI 闸门
        # 令牌副本必须与正本字节一致；不得重复定义令牌、不得写死正本色；
        # 顶栏两枚圆钮、繁简钮文案、说明页只在页脚、侧栏不得自己滚、乐园顺序。
        run: node tools/check-ui.mjs

      - name: 产物体检自检
        # 先证明这条体检抓得住坏样本，再看它说「通过」值不值得信。
        # 它存在的理由就是当年那次事故：253 篇里 148 篇正文是空 div，构建、部署、链接全绿。
        # 判定逻辑做成纯函数之后，坏例子不必先构建整站，喂一段 HTML 就能测。
        run: python tools/check-pages.py --selftest

      - name: 产物体检
        # 抓「生成出来是空的」这类静默故障。
        # 曾经 253 篇里有 148 篇的正文是空 div：构建成功、部署成功、链接全通，
        # 只有点开那一页才看得见——所以必须有一条只看产物的断言。
        # 正文为空会 exit 1 阻断部署；注释/译文/赏析仍是占位只 warn，不阻断。
        run: python tools/check-pages.py

      - name: 字号结构闸门自检
        # 正文每行必须是 <p>、块内不留空行（markdown-it 的 html_block 在空行处结束，
        # 不包就会同一首诗前半 16px、后半 1.3rem）。先证明它抓得住坏样本。
        run: node tools/check-typography.mjs --selftest

      - name: 字号结构闸门
        run: node tools/check-typography.mjs

      - name: 构建站点
        run: npm run build
        env:
          SITE_BASE: '/'

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
