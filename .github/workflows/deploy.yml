name: 部署站点

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # job 级环境变量：CONTENT_ROOT 必须覆盖到 npm 子进程，
    # 否则 prebuild 钩子会因找不到内容仓而失败。
    env:
      CONTENT_ROOT: ${{ github.workspace }}/content
    steps:
      - name: 检出站点仓
        uses: actions/checkout@v5

      - name: 检出内容仓
        uses: actions/checkout@v5
        with:
          repository: diuci/k12-chinese-poetry
          path: content

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 从内容仓生成站点页面
        run: python tools/build-site.py

      - name: 法律护栏自检
        # 先证明检查器抓得住坏样本，再看它说"通过"值不值得信。
        run: node tools/check-legal.mjs --selftest

      - name: 法律护栏
        run: node tools/check-legal.mjs

      - name: 产物体检
        # 抓「生成出来是空的」这类静默故障。
        # 曾经 253 篇里有 148 篇的正文是空 div：构建成功、部署成功、链接全通，
        # 只有点开那一页才看得见——所以必须有一条只看产物的断言。
        # 正文为空会 exit 1 阻断部署；注释/译文/赏析仍是占位只 warn，不阻断。
        run: python tools/check-pages.py

      - name: 构建站点
        run: npm run build
        env:
          SITE_BASE: '/'

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
